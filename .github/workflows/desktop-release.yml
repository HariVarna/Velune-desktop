name: Desktop Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_label:
        description: "Version label for manual test builds (e.g. 1.1.3-dev)"
        required: false
        default: "1.1.2-dev"

permissions:
  contents: write

jobs:
  build-windows:
    name: Validate, Package & Publish Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release and jpackage versions
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $raw = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $raw = "${{ inputs.version_label }}".TrimStart('v')
          }
          $numeric = ($raw -split '-', 2)[0]
          if ($numeric -notmatch '^\d+\.\d+\.\d+$') {
            $numeric = "1.1.2"
          }
          "asset_version=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "jpackage_version=$numeric" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage ffplay.exe for bundled audio playback
        shell: pwsh
        run: |
          if (-not (Get-Command ffplay.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ff = (Get-Command ffplay.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force -Path "desktop\appResources\windows" | Out-Null
          Copy-Item -LiteralPath $ff -Destination "desktop\appResources\windows\ffplay.exe" -Force

      - name: Validate desktop module and run offline unit tests
        run: .\gradlew.bat :desktop:jar :desktop:test --tests "com.nikhil.yt.desktop.DesktopPackagingTest" -PveluneDesktopVersion="${{ steps.version.outputs.jpackage_version }}" --no-daemon

      - name: Build Windows portable app image, EXE, and MSI
        run: .\gradlew.bat :desktop:createDistributable :desktop:packageExe :desktop:packageMsi -PveluneDesktopVersion="${{ steps.version.outputs.jpackage_version }}" --no-daemon

      - name: Verify packaged outputs and bundled runtime
        shell: pwsh
        run: |
          $appDir = "desktop\build\compose\binaries\main\app\Velune"
          if (-not (Test-Path "$appDir\Velune.exe")) { throw "Missing Velune.exe in $appDir" }
          if (-not (Test-Path "$appDir\runtime")) { throw "Missing bundled runtime in $appDir" }
          if (-not (Test-Path "$appDir\app\resources\ffplay.exe")) { throw "Missing bundled ffplay.exe in $appDir\app\resources" }

          $exe = Get-ChildItem "desktop\build\compose\binaries\main\exe\*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "desktop\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
          if (-not $exe) { throw "Missing EXE installer output" }
          if (-not $msi) { throw "Missing MSI installer output" }

      - name: Optional Windows Authenticode signing
        id: sign
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_BASE64) -or [string]::IsNullOrEmpty($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "No Windows code-signing certificate secrets configured; publishing unsigned installers."
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "velune-codesign.pfx"
          try {
            $bytes = [Convert]::FromBase64String(($env:WINDOWS_CERT_BASE64 -replace '\s+', ''))
            [IO.File]::WriteAllBytes($pfxPath, $bytes)
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found on runner" }
            $targets = @(
              (Get-ChildItem "desktop\build\compose\binaries\main\exe\*.exe" | Select-Object -First 1 -ExpandProperty FullName),
              (Get-ChildItem "desktop\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1 -ExpandProperty FullName),
              "desktop\build\compose\binaries\main\app\Velune\Velune.exe"
            )
            foreach ($t in $targets) {
              & $signtool sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $t
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $t" }
            }
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } finally {
            if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
          }

      - name: Package release assets and generate SHA-256 checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.asset_version }}"
          $outDir = "release-desktop"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $exe = Get-ChildItem "desktop\build\compose\binaries\main\exe\*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "desktop\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
          Copy-Item $exe.FullName "$outDir\Velune-Setup-$ver-x64.exe" -Force
          Copy-Item $msi.FullName "$outDir\Velune-$ver-x64.msi" -Force
          Compress-Archive -Path "desktop\build\compose\binaries\main\app\Velune\*" -DestinationPath "$outDir\Velune-Portable-$ver-x64.zip" -Force

          Push-Location $outDir
          try {
            $files = Get-ChildItem -File | Sort-Object Name
            $lines = foreach ($f in $files) {
              $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($f.Name)"
            }
            $lines | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          } finally {
            Pop-Location
          }
          Get-ChildItem $outDir | Select-Object Name, Length

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velune-desktop-windows-${{ steps.version.outputs.asset_version }}
          path: release-desktop/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Velune Desktop — HariVarna Fork Release (`${{ github.ref_name }}`)**

            > This is an independent fork release from `HariVarna/Velune-desktop` and is **not** an official upstream release from `nikhilvishwakarma00/Velune`.

            ### Windows x64 Downloads
            - **Velune-Setup-${{ steps.version.outputs.asset_version }}-x64.exe** — Windows x64 EXE Installer (self-contained JDK 21 + `ffplay.exe`)
            - **Velune-${{ steps.version.outputs.asset_version }}-x64.msi** — Windows x64 MSI Installer (self-contained JDK 21 + `ffplay.exe`)
            - **Velune-Portable-${{ steps.version.outputs.asset_version }}-x64.zip** — Portable Windows x64 distribution (extract and run `Velune.exe`)
            - **SHA256SUMS.txt** — SHA-256 verification checksums

            **Signing status:** ${{ steps.sign.outputs.signed == 'true' && 'Authenticode signed.' || 'Unsigned installers (Windows SmartScreen may prompt on first launch).' }}
          files: release-desktop/*
